<h2>Span, Basis & Dimension</h2>

<form method="POST">

    <input type="hidden" name="topic" value="span">

    <label for="vectors">Number of Vectors:</label>
    <input
        type="number"
        id="vectors"
        name="vectors"
        min="1"
        required
    >

    <br><br>

    <label for="dimension">Dimension of each Vector:</label>
    <input
        type="number"
        id="dimension"
        name="dimension"
        min="1"
        required
    >

    <br><br>

    <button type="button" onclick="generateSpanVectors()">
        Generate Vectors
    </button>

    <br><br>

    <div id="span-vector-inputs"></div>

    <br>

    <button type="submit">
        Solve
    </button>

</form>

{% if span %}

<hr>

<h3>Span</h3>

<p>{{ span }}</p>

{% endif %}


{% if basis %}

<h3>Basis</h3>

<p>{{ basis }}</p>

{% endif %}


{% if dimension is not none %}

<h3>Dimension</h3>

<p>{{ dimension }}</p>

</hr>
{% endif %}
