<h2>Linear Dependence & Independence</h2>

<form method="POST">

    <input type="hidden" name="topic" value="dependence">

    <label for="vectors">Number of Vectors:</label>
    <input type="number" id="vectors" name="vectors" min="1" required>

    <br><br>

    <label for="dimension">Dimension of each Vector:</label>
    <input type="number" id="dimension" name="dimension" min="1" required>

    <br><br>

    <button type="button" onclick="generateVectors()">
        Generate
    </button>

    <br><br>

    <div id="vector-inputs"></div>

    <br>

    <button type="submit">
        Check
    </button>

</form>

{% if result %}

<hr>

<h3>Result</h3>

<p>
    <strong>{{ result.result }}</strong>
</p>

<p>
    <strong>Number of Vectors:</strong>
    {{ result.number_of_vectors }}
</p>

<p>
    <strong>Number of Pivots:</strong>
    {{ result.pivot_count }}
</p>

<p>
    <strong>Reason:</strong>
    {{ result.reason }}
</p>

{% endif %}
